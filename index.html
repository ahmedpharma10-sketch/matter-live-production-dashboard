<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MATTER — Live Production Dashboard</title><style>
:root{--bg:#0a0d12;--panel:#131925;--line:#273044;--text:#edf2ff;--muted:#9ea9bd;--ok:#52d18a;--bad:#ff6b75;--warn:#ffbf5b;--blue:#69a7ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#07090d,#111827);color:var(--text);font:15px/1.5 system-ui,Segoe UI,sans-serif}header{padding:28px 5vw;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0a0d12ee;backdrop-filter:blur(12px);z-index:2}h1{margin:0;font-size:clamp(25px,4vw,44px)}.muted{color:var(--muted)}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}button{background:#151d2b;color:var(--text);border:1px solid var(--line);padding:9px 14px;border-radius:999px;cursor:pointer}button.on{background:var(--blue);color:#07101f}main{padding:24px 5vw 60px}.tab{display:none}.tab.on{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.metric{font-size:30px;font-weight:700}.shot{margin:12px 0}.row{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.pill{font-size:12px;padding:4px 8px;border-radius:999px;background:#263044;white-space:nowrap}.ACCEPTED_CURRENT{color:var(--ok)}.DEFERRED_BLOCKER,.ATTEMPTED_NOT_ACCEPTED{color:var(--bad)}.NOT_YET_ATTEMPTED{color:var(--warn)}video{width:100%;max-height:420px;background:#000;border-radius:10px;margin-top:12px}details{margin-top:8px}code{color:#b7d1ff}.gap{border-left:4px solid var(--warn)}@media(max-width:600px){header,main{padding-left:16px;padding-right:16px}.row{display:block}.pill{display:inline-block;margin:8px 0}}</style></head><body><header><h1>MATTER</h1><div class="muted">Live Production Dashboard · verified S08 render truth</div><nav></nav></header><main><section id="STATUS" class="tab on"></section><section id="STORY" class="tab"></section><section id="REFERENCES" class="tab"></section><section id="SHOTS" class="tab"></section><section id="KEYFRAMES" class="tab"></section><section id="RENDERS" class="tab"></section></main><script>
let D;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function nav(){for(const id of ['STATUS','STORY','REFERENCES','SHOTS','KEYFRAMES','RENDERS']){let b=document.createElement('button');b.textContent=id;b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.querySelectorAll('button').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');b.classList.add('on')};if(id==='STATUS')b.classList.add('on');document.querySelector('nav').appendChild(b)}}
function shot(r,video=false){return `<article class="card shot"><div class="row"><div><b>${esc(r.shot_id)}</b> · ${esc(r.batch)} · ${esc(r.duration_seconds)}s<br><span class="muted">${esc(r.description)}</span></div><span class="pill ${esc(r.status)}">${esc(r.status)}</span></div><details><summary>bindings + QC</summary><p><code>${esc(r.start_binding)}</code><br>${esc(r.dialogue_route)}<br>${esc(r.qc_note)}</p></details>${video&&r.review_proxy?`<video controls preload="metadata" src="${esc(r.review_proxy)}"></video>`:''}</article>`}
fetch('data.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{D=d;nav();let c=Object.entries(d.counts).map(([k,v])=>`<div class="card"><div class="metric ${k}">${v}</div><div>${esc(k)}</div></div>`).join('');document.getElementById('STATUS').innerHTML=`<div class="grid">${c}<div class="card"><div class="metric">${d.total_units}</div><div>Total executable units</div></div></div><h2>Not updated yet</h2>${d.not_updated_yet.map(x=>`<div class="card gap">${esc(x)}</div>`).join('')}<p class="muted">Updated ${esc(d.updated_at)} · movie complete: NO</p>`;document.getElementById('STORY').innerHTML=`<div class="card"><h2>Story</h2><p>${esc(d.story.status)}</p><p class="muted">${esc(d.story.note)}</p></div>`;document.getElementById('REFERENCES').innerHTML=`<div class="card gap"><h2>References</h2><p>${esc(d.references.status)}</p><p>${esc(d.references.note)}</p></div>`;document.getElementById('KEYFRAMES').innerHTML=`<div class="card"><h2>Keyframes / START bindings</h2><p>${esc(d.keyframes.note)}</p></div>`+d.shots.map(r=>`<div class="card"><b>${esc(r.shot_id)}</b> · <code>${esc(r.start_binding)}</code> · <span class="${esc(r.status)}">${esc(r.status)}</span></div>`).join('');document.getElementById('SHOTS').innerHTML=d.shots.map(r=>shot(r,false)).join('');document.getElementById('RENDERS').innerHTML=d.shots.filter(r=>r.review_proxy||r.status!=='NOT_YET_ATTEMPTED').map(r=>shot(r,true)).join('')});
</script></body></html>
